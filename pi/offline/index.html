<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Brass Moon Espresso Bar</title>

    <link rel="stylesheet" href="./menu.css" />
    <script src="./menu.js" defer></script>
  </head>

  <body>
    <main class="menu-screen">
      <div class="menu-canvas">
        <!-- Illustrator artwork, including Brass Moon branding -->
        <div class="menu-background"></div>

        <div class="menu-content">
          <section class="coffee-position">
            <h2 class="menu-section-title">COFFEE</h2>
            <div class="menu-section-items" id="coffee-items"></div>
          </section>

          <section class="espresso-position">
            <h2 class="menu-section-title">ESPRESSO</h2>
            <div class="menu-section-items" id="espresso-items"></div>
          </section>

          <section class="noncoffee-position">
            <h2 class="menu-section-title">NON - COFFEE</h2>
            <div class="menu-section-items" id="noncoffee-items"></div>
          </section>

          <section class="syrups-position">
            <h2 class="menu-section-title">SYRUPS &amp; SAUCE</h2>
            <p class="menu-description" id="syrups-list"></p>
          </section>

          <section class="addons-position">
            <h2 class="menu-section-title">
              ADD-ONS
              <span class="addons-price" id="addons-price"></span>
            </h2>
            <p class="menu-description" id="addons-list"></p>
          </section>
        </div>
      </div>
    </main>
  </body>
</html>
